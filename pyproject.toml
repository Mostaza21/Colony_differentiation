[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77",
    "setuptools-scm>=7",
]

[project]
name = "colony_differentiation"
dynamic = ["version"]
description = "A Python toolbox for detecting and differentiating microbial colonies in images"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Gerrit Ansmann", email = "gansmann@uni-koeln.de" },
    { name = "Aylin Hartmann" },
]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy>=1.14",
    "rawpy",
    "matplotlib>=3.8",
    "tqdm",
    "termcolor",
    "scikit-learn",
    "opencv-python",
    "Pillow",
    "ipython",
    "ipywidgets",
    "ipympl",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/Mostaza21/Colony_differentiation"

[tool.setuptools.packages.find]
include = [
    "colony_differentiation*",
]

[tool.setuptools_scm]
write_to = "colony_differentiation/version.py"
local_scheme = "no-local-version"
